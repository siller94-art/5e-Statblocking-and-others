name: Validate Statblock 5e

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate module.json
        run: node -e "const m=JSON.parse(require('fs').readFileSync('module.json','utf8')); for (const f of [...m.esmodules, ...m.styles]) require('fs').accessSync(f); console.log('module.json OK')"
      - name: Validate JavaScript syntax
        run: for f in scripts/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
      - name: Parse example statblocks
        run: node .github/scripts/check-examples.mjs
      - name: Check the zip matches the source
        run: |
          mkdir /tmp/zip && unzip -q statblock-5e.zip -d /tmp/zip
          for f in module.json scripts/*.js styles/*.css; do cmp -s "$f" "/tmp/zip/$f" || { echo "statblock-5e.zip is out of date ($f) — run ./build.sh"; exit 1; }; done
          echo "zip OK"
